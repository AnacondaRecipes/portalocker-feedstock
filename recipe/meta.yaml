{% set name = "portalocker" %}
{% set version = "2.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4e913d807aa6598c320e8a50c50e2ee0602bc45240b485e3f8bc06f13060084c

build:
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools >=38.3.0
  run:
    - python
    - pywin32 !=226  # [win]

test:
  source_files:
    - portalocker_tests
  imports:
    - portalocker
  commands:
    - pip check
    - pytest -v portalocker_tests --deselect=portalocker_tests/test_combined.py::test_combined --ignore=portalocker_tests/test_redis.py
  requires:
    - pip
    - pytest >=5.4.1
    - pytest-cov >=2.8.1
    - pytest-flakes >=1.0.5
    - redis

about:
  home: https://github.com/WoLpH/portalocker
  license: PSF-2.0
  license_family: PSF
  license_file: LICENSE
  summary: Portalocker is a library to provide an easy API to file locking.
  doc_url: http://portalocker.readthedocs.org
  dev_url: https://github.com/WoLpH/portalocker

extra:
  recipe-maintainers:
    - sodre
